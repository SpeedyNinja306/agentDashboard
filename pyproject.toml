[project]
name = "agentdashboard"
version = "0.1.0"
description = "Personal multi-agent orchestration system with a live visual control panel."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "workers*", "eval*"]
