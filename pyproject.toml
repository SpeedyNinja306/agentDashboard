[project]
name = "agentdashboard"
version = "0.1.0"
description = "Personal multi-agent orchestration system with a live visual control panel."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn needs an explicit WebSocket implementation; naming it here rather than relying on
    # uvicorn[standard] keeps the dependency visible and avoids that extra's unrelated additions.
    "websockets>=12",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "workers*", "eval*"]
